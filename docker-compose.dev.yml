# Local development overlay — hot reload via watchfiles + bind mounts.
# Same machine as mimir-api compose; use API_URL=http://host.docker.internal:5000
# Preferred: make dev  (starts mimir-api via its Makefile if needed, then this stack)

services:
  bot:
    build:
      dockerfile: Dockerfile.dev
    volumes:
      - ./src:/app/src
      - ./pyproject.toml:/app/pyproject.toml:ro
    environment:
      PYTHONPATH: /app/src
      API_URL: http://host.docker.internal:5000
    command: watchfiles --filter python "python src/main.py" src
    restart: 'no'
