[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mimir-bot"
version = "2.0.0"
description = "Mimir personal-finance Telegram bot (aiogram 3)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.15,<4",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bot", "src/core", "src/presentation", "src/schemas", "src/services"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["bot", "core", "presentation", "schemas", "services"]
